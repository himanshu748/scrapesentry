services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"
      interval: 5s
      timeout: 3s
      retries: 12

  dashboard:
    build:
      context: ./dashboard
    environment:
      API_SERVER_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
