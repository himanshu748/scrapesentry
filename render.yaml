services:
  - type: web
    name: scrapesentry-api-himanshu748
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install .
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: demo
      - key: MONITOR_ENABLED
        value: false
      - key: PYTHON_VERSION
        value: 3.12.8
