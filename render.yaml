services:
  - type: web
    name: scrapesentry-api-himanshu748
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install .
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: demo
      - key: MONITOR_ENABLED
        value: false
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: scrapesentry-himanshu748
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: dashboard
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: API_SERVER_URL
        fromService:
          name: scrapesentry-api-himanshu748
          type: web
          envVarKey: RENDER_EXTERNAL_URL
